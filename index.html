<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WADE Fragrances offers luxury scent collections for confident everyday wear."
    />
    <title>WADE Fragrances</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-wrap">
        <a href="index.html" class="brand-name">WADE</a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html" class="current-page">Home</a>

    <main>

          <p class="eyebrow">Luxury scent experience</p>

            <a href="shopping.html" class="primary-btn">Start Shopping</a>

        <div class="hero-visual" aria-hidden="true">
          <div class="bottle-glow"></div>
          <div class="perfume-bottle">

    <footer class="site-footer">
